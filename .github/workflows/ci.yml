##########################################################################
#              Линтер и тесты проекта (Hexlet, шаг 2)              #
##########################################################################

name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build